syntax = "proto3";

option csharp_namespace = "DocIntegrator.Api.Grpc";

package documents;

// gRPC-сервис для работы с документами (межсервисная коммуникация).
service Documents {
  // Простая операция чтения документа по идентификатору.
  rpc GetDocumentById (GetDocumentByIdRequest) returns (DocumentReply);
}

message GetDocumentByIdRequest {
  string id = 1;
}

message DocumentReply {
  string id = 1;
  string title = 2;
  string content = 3;
  string status = 4;
  string createdAt = 5;
}

