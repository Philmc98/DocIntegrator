# DocIntegrator: API + PostgreSQL
# Запуск: docker-compose up -d
# Миграции: docker-compose run api dotnet ef database update --project DocIntegrator.Infrastructure

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Основная БД PostgreSQL
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=DocIntegrator;Username=postgres;Password=postgres"
      # Дополнительный event store на MS SQL (демонстрация владения MS SQL)
      ConnectionStrings__DefaultConnectionSqlServer: "Server=mssql,1433;Database=DocIntegratorEventStore;User Id=sa;Password=Your_password123;Encrypt=False"
      # Redis для кеширования документов
      ConnectionStrings__Redis: "redis:6379"
      # Kafka (message broker)
      Kafka__BootstrapServers: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      mssql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DocIntegrator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MS SQL Server — отдельное хранилище (например, для event store).
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Your_password123 -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis — кеш для быстрых чтений.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Zookeeper + Kafka — брокер сообщений для интеграции микросервисов.
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  # ClickHouse — аналитическое хранилище для отчетов по документам.
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports:
      - "8123:8123"
      - "9000:9000"

volumes:
  pgdata:
