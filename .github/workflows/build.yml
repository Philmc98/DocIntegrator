# CI/CD: сборка, тесты, артефакты, Docker-образ
name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore DocIntegrator.sln

      - name: Build
        run: dotnet build DocIntegrator.sln -c Release --no-restore

      - name: Test
        run: dotnet test DocIntegrator.sln -c Release --no-build --verbosity normal
        continue-on-error: true

      - name: Publish API
        run: dotnet publish DocIntegrator.Api/DocIntegrator.Api.csproj -c Release -o ./publish --no-build

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: docintegrator-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
